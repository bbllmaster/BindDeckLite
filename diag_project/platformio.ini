; Standalone diagnostic project (not part of the product build).
; Same bootloader + 16 MB partition table as the product image, but a trivial
; app that only prints on UART0 - isolates a boot-chain failure from an app one.
[env:diag]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
board_build.partitions = ../partitions/binddecklite_16mb_c3.csv
board_build.f_flash = 40000000L
build_flags = -DTARGET_ESP32C3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
monitor_speed = 115200

[env:diag_dout]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
board_build.partitions = ../partitions/binddecklite_16mb_c3.csv
board_build.f_flash = 40000000L
board_build.flash_mode = dout
build_flags = -DTARGET_ESP32C3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
monitor_speed = 115200
