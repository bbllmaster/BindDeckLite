; BindDeckLite — 9 buttons + EC11, no display.
; Two targets: classic ESP32 and ESP32-C3.
;
; No display libraries are pulled in (the Lite board has no OLED), so the app
; is small and the C3 pin budget fits 9 buttons + 3 encoder pins.
;
; Build:   pio run -e esp32dev          (or -e esp32c3)
; Flash:   pio run -e esp32dev -t upload
; Monitor: pio device monitor -b 115200  (classic ESP32; C3 logs on USB-CDC)

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions/binddecklite_ota.csv

[env:esp32c3]
board = esp32-c3-devkitc-02
board_build.partitions = partitions/binddecklite_ota_c3.csv
build_flags = -DTARGET_ESP32C3

; C3 modules with 2 MB flash: the 4 MB table above cannot be used because its
; app1 partition (0x200000) lies past the end of the chip, and the bootloader
; rejects the entire table in that case (silently - Arduino 2.0.17 builds the
; bootloader with BOOTLOADER_LOG_LEVEL_NONE). Single app slot, no OTA.
[env:esp32c3_2mb]
board = esp32-c3-devkitc-02
board_build.partitions = partitions/binddecklite_2mb_c3.csv
build_flags = -DTARGET_ESP32C3
