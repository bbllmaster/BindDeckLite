; BindDeckLite — 9 buttons + EC11, no display.
; Two targets: classic ESP32 and ESP32-C3.
;
; No display libraries are pulled in (the Lite board has no OLED), so the app
; is small and the C3 pin budget fits 9 buttons + 3 encoder pins.
;
; Build:   pio run -e esp32dev          (or -e esp32c3)
; Flash:   pio run -e esp32dev -t upload
; Monitor: pio device monitor -b 115200  (classic ESP32; C3 logs on USB-CDC)

[env]
; Arduino core 3.x: the pioarduino platform (ESP-IDF 5.5) is required. The
; upstream platform-espressif32 still ships Arduino core 2.0.17 (ESP-IDF 4.4),
; whose bootloader cannot bring up this 16 MB C3 module (WS-278).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.1.0
    thomasfredericks/Bounce2 @ ^2.71

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions/binddecklite_ota.csv

[env:esp32c3]
board = esp32-c3-devkitc-02
board_build.partitions = partitions/binddecklite_ota_c3.csv
build_flags = -DTARGET_ESP32C3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

; C3 modules with 2 MB flash: the 4 MB table above cannot be used because its
; app1 partition (0x200000) lies past the end of the chip, and the bootloader
; rejects the entire table in that case (the 16 MB bootloader in bl_idf is
; built with BOOTLOADER_LOG_LEVEL_NONE). Single app slot, no OTA.
; C3 modules with 16 MB flash. 40 MHz DIO is deliberately conservative: some
; 16 MB chips are unstable at the 80 MHz the stock C3 bootloader is built for,
; which shows up as a silent reset loop right after "entry".
[env:esp32c3_16mb]
board = esp32-c3-devkitc-02
board_build.partitions = partitions/binddecklite_16mb_c3.csv
board_build.f_flash = 40000000L
; WS-377: this env never pinned the flash mode, so the app inherited the
; pioarduino default (QIO) while the 16 MB bootloader in bl_idf runs DIO.
; The mismatch broke the *read* path only: esp_flash_read()/esp_partition_read()
; returned 0xFF for every address (including the running app's own header),
; so every write looked like it "did not land" and Update.end()'s read-back
; verification could never pass. Writes were fine all along.
board_build.flash_mode = dio
; Keep the app image header consistent with the 16 MB layout (OTA images too).
board_upload.flash_size = 16MB
build_flags = -DTARGET_ESP32C3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:esp32c3_2mb]
board = esp32-c3-devkitc-02
board_build.partitions = partitions/binddecklite_2mb_c3.csv
build_flags = -DTARGET_ESP32C3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
