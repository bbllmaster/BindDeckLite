name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

# Two delivery channels:
#  * push to main  -> rolling pre-release (nightly), tagged main-<utc>
#  * push of v* tag -> formal release on that tag
# The build is self-contained: it builds the authoritative merged/OTA images
# (tools/build_release.py does the esptool merge, which the per-env compile in
# build-firmware.yml does NOT) and the Windows host exe, then publishes them all
# on the tag. Keeping the build inside one workflow lets the publish job fetch
# the artifacts with a plain needs()-dependent download - no cross-workflow
# polling, no race between sibling workflows.
#
# WS-571: a push that only touches host/ does not rebuild the firmware (and
# vice versa). The publish job then copies the other half's assets from the
# previous release, so the new release is still self-contained and update.json
# always carries the app + all three firmware variants.
jobs:
  # WS-571: 按变更路径裁剪构建。只改上位机就不再重编三个固件环境，只改
  # 固件就不再重打 exe；正式 tag 仍然全量重建（tag 必须可复现）。
  # 路径集合的唯一来源是 tools/release_changes.py（可被测试直接 import）。
  changes:
    name: release / changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
      host: ${{ steps.diff.outputs.host }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 before..sha 的历史：depth-1 克隆拿不到被比较的提交。
          fetch-depth: 0

      - name: Decide which halves to rebuild
        id: diff
        shell: bash
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python tools/release_changes.py --ref "$REF" --before "$BEFORE" \
            --sha "$SHA" --list | tee -a "$GITHUB_OUTPUT"

  firmware:
    name: release / firmware
    needs: [changes]
    # 正式 tag 无条件重建；否则看 changes 的判定。
    if: needs.changes.outputs.firmware == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO Core and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          # Explicit esptool dependency: the PlatformIO bundle's esptool.py
          # imports rich_click, which is NOT in the runner's base Python.
          # Installing esptool via pip also provides rich_click and lets
          # build_release.py use `python -m esptool` (self-contained deps).
          pip install esptool

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'bl_idf/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build release images
        run: |
          python tools/build_release.py
          # Non-silent verification: every expected merged/ota image must exist.
          for f in dist/merged_binddecklite_esp32_v*.bin \
                   dist/merged_binddecklite_c3_v*.bin \
                   dist/merged_binddecklite_c3_16mb_v*.bin; do
            test -f "$f" || { echo "missing release image: $f"; exit 1; }
          done
          ls -lh dist/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            dist/*.bin
          if-no-files-found: error

  host:
    name: release / host-exe
    needs: [changes]
    if: needs.changes.outputs.host == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    outputs:
      # The app version baked into the exe. The publish job reuses it verbatim
      # so update.json.app.version and the exe can never disagree.
      version: ${{ steps.version.outputs.VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host/requirements.txt
          python -m pip install -r host/requirements-build.txt

      # The version must be in host/_version.py BEFORE PyInstaller runs, so the
      # exe carries it. The same value is exported to the publish job, so
      # update.json.app.version and the exe can never disagree.
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          python tools/release_version.py --ref "$GITHUB_REF" --sha "$GITHUB_SHA" \
            --write-version-file host/_version.py --build "$GITHUB_SHA" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Build Windows exe
        working-directory: host
        run: pyinstaller --noconfirm --clean app.spec

      - name: Smoke test (starts, serves, exits)
        working-directory: host
        shell: pwsh
        run: |
          $env:BINDDECKLITE_PORT = "8799"
          $env:BINDDECKLITE_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\BindDeckLite.exe" -ArgumentList "--desktop","--no-tray","--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/desktop -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "exe did not serve /api/desktop" }
          $body = $r.Content | ConvertFrom-Json
          if (-not $body.frozen) { throw "exe did not report frozen=true" }
          # The version baked into the exe must be the one the release
          # publishes - otherwise the app would never see its own update.
          $v = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/app/version -TimeoutSec 2
          $ver = ($v.Content | ConvertFrom-Json).version
          if ($ver -ne "${{ steps.version.outputs.VERSION }}") {
            throw "exe version '$ver' != release version '${{ steps.version.outputs.VERSION }}'"
          }
          taskkill /PID $p.Id /T /F
          Write-Host "smoke test ok (version $ver)"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: |
            host/dist/BindDeckLite.exe
          if-no-files-found: error

  release:
    name: release / publish
    needs: [changes, firmware, host]
    # firmware / host 可能被 changes 裁剪成 skipped：那不算失败，publish 仍要
    # 跑（用上一版的产物补齐另一半）。既没有固件也没有上位机改动（纯文档）
    # 时不发布，避免产生内容不变的 Release。
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.changes.outputs.firmware == 'true' ||
       needs.changes.outputs.host == 'true' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Rolling notes diff HEAD against the previous main-* tag
          # (git log <since>..HEAD), which a depth-1 clone cannot do: it has
          # neither the history nor the tags.
          fetch-depth: 0
          fetch-tags: true

      # 两个 artifact 分开下载：某个 job 被跳过时，按名字下载不存在的东西
      # 会让 download-artifact 直接报错。
      - name: Download firmware artifacts
        if: needs.firmware.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: artifacts
          merge-multiple: true

      - name: Download exe artifact
        if: needs.host.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: release-exe
          path: artifacts
          merge-multiple: true

      # 本次没有重建的那一半，从上一版 Release 取回同名资产重新上传。
      # 必须是「拷贝到本 Release」而不是「链接到旧 Release」：rolling 只保留
      # 最新 1 个，旧 Release 随时会被删，链接过去就会 404。
      - name: Reuse unchanged half from the previous release
        if: needs.firmware.result == 'skipped' || needs.host.result == 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          # 挑最新的、资产齐全（1 个 exe + 3 个 ota bin + update.json）的
          # 非 draft Release：缺资产的（例如早期实验性发布）直接跳过。
          prev=""
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            mapfile -t names < <(gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" --json assets \
              --jq '.assets[].name')
            bins=$(printf '%s\n' "${names[@]}" | grep -cE '^ota_binddecklite_.+\.bin$' || true)
            exe=$(printf '%s\n' "${names[@]}" | grep -cx 'BindDeckLite.exe' || true)
            manifest=$(printf '%s\n' "${names[@]}" | grep -cx 'update.json' || true)
            if [[ "${bins}" -ge 3 && "${exe}" -eq 1 && "${manifest}" -eq 1 ]]; then
              prev="${tag}"
              break
            fi
            echo "==> skip ${tag} (bins=${bins} exe=${exe} manifest=${manifest})"
          done < <(gh release list --repo "${GITHUB_REPOSITORY}" --limit 50 \
                     --json tagName,isDraft,createdAt \
                     --jq 'map(select(.isDraft | not)) | sort_by(.createdAt) | reverse | .[].tagName')

          if [[ -z "${prev}" ]]; then
            echo "no previous release carries a complete asset set" >&2
            exit 1
          fi
          echo "==> reusing assets from ${prev}"

          if [[ "${{ needs.firmware.result }}" == "skipped" ]]; then
            gh release download "${prev}" --repo "${GITHUB_REPOSITORY}" \
              --dir artifacts --pattern '*.bin' --clobber
          fi
          if [[ "${{ needs.host.result }}" == "skipped" ]]; then
            gh release download "${prev}" --repo "${GITHUB_REPOSITORY}" \
              --dir artifacts --pattern 'BindDeckLite.exe' --clobber
            # 沿用的 exe 版本号就是这个 manifest 里的 app.version。
            gh release download "${prev}" --repo "${GITHUB_REPOSITORY}" \
              --dir artifacts --pattern 'update.json' --clobber
          fi
          ls -lh artifacts/

      # host 跑过就用它刚算出的版本号；跳过了就沿用上一版 update.json 里
      # 的 app.version —— 沿用的 exe 与 manifest 必须说的是同一个版本。
      - name: Resolve app version
        id: appver
        shell: bash
        env:
          HOST_VERSION: ${{ needs.host.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${HOST_VERSION}" ]]; then
            version="${HOST_VERSION}"
          else
            version="$(jq -r '.app.version' artifacts/update.json)"
          fi
          [[ -n "${version}" ]] || { echo "empty app version"; exit 1; }
          echo "APP_VERSION=${version}" >> "$GITHUB_OUTPUT"
          echo "==> app version: ${version}"

      - name: SHA256 sums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.bin BindDeckLite.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Release body + manifest notes must carry the "本次更新" section
      # (WS-523 验收 11). A release without it is an unfinished release, so
      # this step fails the job BEFORE any Release is created.
      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SINCE=""
          else
            TAG="main-$(date -u +%Y%m%d-%H%M)"
            # Rolling notes list only what changed since the previous rolling
            # tag (WS-558). The first rolling falls back to the newest formal
            # v* tag; a repo with no tags at all starts at the first commit
            # (the script then ranges over every commit).
            SINCE="$(git describe --tags --abbrev=0 --match 'main-*' HEAD^ 2>/dev/null || true)"
            if [[ -z "${SINCE}" ]]; then
              SINCE="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            fi
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "${SINCE}" ]]; then
            echo "==> rolling notes range: ${SINCE}..HEAD"
            python tools/release_notes.py --tag "${TAG}" --out RELEASE_NOTES_BODY.md --since "${SINCE}"
          else
            python tools/release_notes.py --tag "${TAG}" --out RELEASE_NOTES_BODY.md
          fi

      - name: Build update.json manifest
        shell: bash
        env:
          APP_VERSION: ${{ steps.appver.outputs.APP_VERSION }}
        run: |
          set -euo pipefail
          python tools/build_manifest.py \
            --assets artifacts \
            --app-version "${APP_VERSION}" \
            --notes-file RELEASE_NOTES_BODY.md \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --out artifacts/update.json
          cat artifacts/update.json

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.appver.outputs.APP_VERSION }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(artifacts/*.bin artifacts/BindDeckLite.exe artifacts/update.json artifacts/SHA256SUMS.txt)

          # 本次重建了哪一半（WS-571）：写进正文，读 Release 的人能一眼看出
          # 哪些资产是新编的、哪些是沿用上一版的。
          FW="${{ needs.firmware.result }}"
          HOST="${{ needs.host.result }}"
          if [[ "${FW}" == "success" && "${HOST}" == "success" ]]; then
            SCOPE="上位机 + 固件（全部重新构建）"
          elif [[ "${FW}" == "success" ]]; then
            SCOPE="仅固件（上位机沿用上一版 exe）"
          else
            SCOPE="仅上位机（固件沿用上一版 bin）"
          fi

          # Tag push -> formal release on that tag; main push -> rolling
          # pre-release tagged main-<utc> (never collides, recreated per run).
          # The prerelease flag comes from the host job, so the exe version and
          # the channel can never disagree.
          TAG="${{ steps.notes.outputs.TAG }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXTRA=()
            TITLE="BindDeckLite ${TAG}"
            CHANNEL="正式发布"
          else
            EXTRA=(--prerelease)
            TITLE="BindDeckLite main (rolling)"
            CHANNEL="滚动预发布 (pre-release)"
          fi
          if [[ "${{ needs.host.outputs.prerelease }}" == "true" ]]; then
            EXTRA+=(--prerelease)
          fi

          {
            echo "# BindDeckLite ${TAG}"
            echo
            echo "${CHANNEL} of the BindDeckLite firmware (merged + app-only OTA"
            echo "images) and the Windows host executable."
            echo
            echo "本次发布：${SCOPE}"
            echo
            # The "本次更新" section is mandatory (WS-523 验收 11); its content
            # is identical to update.json.notes.
            cat RELEASE_NOTES_BODY.md
            echo
            echo "## SHA256"
            echo
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
            echo
            echo "- Firmware: merged images flash whole-chip from 0x0; ota_ images are"
            echo "  app-only for the config-mode OTA page."
            echo "- Host: BindDeckLite.exe - single-file Windows executable (Flask + BLE)."
            echo "- 版本清单 update.json 随本次发布一同上传，上位机据此在线更新。"
            echo
            echo "Board-specific flashing notes and the full version manifest live in the"
            echo "[WS-279](https://github.com/bbllmaster/BindDeckLite) release tracker."
            echo
            echo "Full checksum list: SHA256SUMS.txt (attached to this release)."
          } > RELEASE_NOTES.md

          # The release body must carry the mandatory section.
          grep -q "^## 本次更新" RELEASE_NOTES.md \
            || { echo "release body has no '## 本次更新' section"; exit 1; }

          gh release create "${TAG}" \
            --repo bbllmaster/BindDeckLite \
            --title "${TITLE}" \
            --notes-file RELEASE_NOTES.md \
            "${EXTRA[@]}" \
            "${FILES[@]}"
