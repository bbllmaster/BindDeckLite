name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

# Two delivery channels:
#  * push to main  -> rolling pre-release (nightly), tagged main-<utc>
#  * push of v* tag -> formal release on that tag
# The build is self-contained: it builds the authoritative merged/OTA images
# (tools/build_release.py does the esptool merge, which the per-env compile in
# build-firmware.yml does NOT) and the Windows host exe, then publishes them all
# on the tag. Keeping the build inside one workflow lets the publish job fetch
# the artifacts with a plain needs()-dependent download - no cross-workflow
# polling, no race between sibling workflows.
jobs:
  firmware:
    name: release / firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'bl_idf/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build release images
        run: |
          python tools/build_release.py
          # Non-silent verification: every expected merged/ota image must exist.
          for f in dist/merged_binddecklite_esp32_v*.bin \
                   dist/merged_binddecklite_c3_v*.bin \
                   dist/merged_binddecklite_c3_2mb_v*.bin \
                   dist/merged_binddecklite_c3_16mb_v*.bin; do
            test -f "$f" || { echo "missing release image: $f"; exit 1; }
          done
          ls -lh dist/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            dist/*.bin
          if-no-files-found: error

  host:
    name: release / host-exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host/requirements.txt
          python -m pip install -r host/requirements-build.txt

      - name: Build Windows exe
        working-directory: host
        run: pyinstaller --noconfirm --clean app.spec

      - name: Smoke test (starts, serves, exits)
        working-directory: host
        shell: pwsh
        run: |
          $env:BINDDECKLITE_PORT = "8799"
          $env:BINDDECKLITE_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\BindDeckLite.exe" -ArgumentList "--desktop","--no-tray","--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/desktop -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "exe did not serve /api/desktop" }
          $body = $r.Content | ConvertFrom-Json
          if (-not $body.frozen) { throw "exe did not report frozen=true" }
          taskkill /PID $p.Id /T /F
          Write-Host "smoke test ok"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: |
            host/dist/BindDeckLite.exe
          if-no-files-found: error

  release:
    name: release / publish
    needs: [firmware, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge: true

      - name: SHA256 sums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.bin BindDeckLite.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(artifacts/*.bin artifacts/BindDeckLite.exe artifacts/SHA256SUMS.txt)

          # Tag push -> formal release on that tag; main push -> rolling
          # pre-release tagged main-<utc> (never collides, recreated per run).
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            EXTRA=()
            TITLE="BindDeckLite ${TAG}"
            CHANNEL="正式发布"
          else
            TAG="main-$(date -u +%Y%m%d-%H%M)"
            EXTRA=(--prerelease)
            TITLE="BindDeckLite main (rolling)"
            CHANNEL="滚动预发布 (pre-release)"
          fi

          {
            echo "# BindDeckLite ${TAG}"
            echo
            echo "${CHANNEL} of the BindDeckLite firmware (merged + app-only OTA"
            echo "images) and the Windows host executable."
            echo
            echo "## SHA256"
            echo
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
            echo
            echo "- Firmware: merged images flash whole-chip from 0x0; ota_ images are"
            echo "  app-only for the config-mode OTA page."
            echo "- Host: BindDeckLite.exe - single-file Windows executable (Flask + BLE)."
            echo
            echo "Board-specific flashing notes and the full version manifest live in the"
            echo "[WS-279](https://github.com/bbllmaster/BindDeckLite) release tracker."
            echo
            echo "Full checksum list: SHA256SUMS.txt (attached to this release)."
          } > RELEASE_NOTES.md

          gh release create "${TAG}" \
            --title "${TITLE}" \
            --notes-file RELEASE_NOTES.md \
            "${EXTRA[@]}" \
            "${FILES[@]}"
