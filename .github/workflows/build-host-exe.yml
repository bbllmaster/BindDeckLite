name: Build Windows host exe

# Manual build: Actions → "Build Windows host exe" → Run workflow.
# PyInstaller cannot cross-compile, so the exe has to be produced on Windows.
on:
  workflow_dispatch:
  push:
    tags:
      - "host-v*"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build exe
        working-directory: host
        run: pyinstaller --noconfirm --clean app.spec

      - name: Smoke test (starts, serves, exits)
        working-directory: host
        shell: pwsh
        run: |
          $env:BINDDECKLITE_PORT = "8799"
          $env:BINDDECKLITE_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\BindDeckLite.exe" -ArgumentList "--desktop","--no-tray","--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/desktop -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "exe did not serve /api/desktop" }
          $body = $r.Content | ConvertFrom-Json
          if (-not $body.frozen) { throw "exe did not report frozen=true" }
          taskkill /PID $p.Id /T /F
          Write-Host "smoke test ok"

      - uses: actions/upload-artifact@v4
        with:
          name: BindDeckLite-windows
          path: host/dist/BindDeckLite.exe
          if-no-files-found: error
