name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Each firmware target builds on its own runner so a failure in one env does not
# mask the others; the matrix result is the single source of truth for "did the
# firmware compile".
jobs:
  # Source-level guards that do not need a toolchain: the portal self-check
  # wiring (WS-504) and its inline page script. Cheap enough to run before the
  # matrix so a broken guard fails fast instead of after six minutes of builds.
  guards:
    name: checks / source guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Portal key self-check wiring
        run: python tools/check_key_selfcheck.py

      - name: Portal key self-check page script
        run: node --test host/test_portal_selfcheck.mjs

      # WS-614: compile the production wifiAttemptSnapshot() verbatim against
      # minimal stubs and assert the WiFi attempt scenarios. This harness fails
      # on the pre-WS-614 tree (one dropped poll after a connected hour -> fail).
      - name: Portal WiFi state machine (WS-614)
        run: python tools/test_portal_wifi_state_machine.py

  firmware:
    name: firmware / ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32c3, esp32c3_16mb]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'bl_idf/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build ${{ matrix.env }}
        run: |
          pio run -e ${{ matrix.env }}
          # Explicit, non-silent verification: the build above already fails on
          # a compile error, but this makes the produced image visible in the
          # log and aborts cleanly if the expected file is somehow missing.
          test -f .pio/build/${{ matrix.env }}/firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/*.bin
          if-no-files-found: error