name: Build Windows host exe

# The single Windows exe packaging path: pyinstaller app.spec (windowed, icon,
# pystray / PIL / tkinter hidden imports, templates + static + assets bundled).
#   * workflow_dispatch  - on-demand build for a tag or a manual snapshot
#   * pull_request       - CI gate: the exe must build and serve before merge
# Push to main and tag pushes are handled by release.yml (which builds the same
# app.spec and publishes the release), so this workflow does not duplicate them.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      # The front-end regression tests are plain node scripts under host/.
      # Pin the node version: `node --test` with several file arguments needs
      # a recent node, and the runner image's preinstalled one drifts.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      # WS-569: a duplicate artifact name fails the run with 409 Conflict, so
      # this runs before the expensive pyinstaller build.
      - name: Workflow guard (WS-569)
        run: python -m pytest tools/test_workflows.py -v

      # WS-578: a var(--x) with no definition and no fallback drops the whole
      # declaration instead of the single value, so a missing spacing step made
      # the update dialog lose all padding. Static guard over the real CSS.
      - name: CSS variable guard (WS-578)
        run: python -m pytest tools/test_css_vars.py -v

      # WS-581: spacing values must come from the --sp-* scale. Bare px in
      # padding/margin/gap/offsets drift per component (6px here, 8px there)
      # and cannot be retuned in one place. Only 1px hairlines may stay.
      # The baseline checks pin the rest of the consistency pass: one font
      # ladder, one compact button tier, solid primary fill, --z-* ladder.
      - name: CSS baseline guards (WS-581)
        run: python -m pytest tools/test_css_spacing.py tools/test_css_baseline.py -v

      - name: Build exe
        working-directory: host
        run: pyinstaller --noconfirm --clean app.spec

      - name: Smoke test (starts, serves, exits)
        working-directory: host
        shell: pwsh
        run: |
          $env:BINDDECKLITE_PORT = "8799"
          $env:BINDDECKLITE_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\BindDeckLite.exe" -ArgumentList "--desktop","--no-tray","--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/desktop -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "exe did not serve /api/desktop" }
          $body = $r.Content | ConvertFrom-Json
          if (-not $body.frozen) { throw "exe did not report frozen=true" }
          # tray_available() must return True in the packaged exe: pystray +
          # Pillow must be importable, otherwise minimize-to-tray silently
          # degrades to exit (WS-374 review #2).  Probed unconditionally
          # (independent of --no-tray) so this check is meaningful.
          if (-not $body.tray_available) {
            throw "exe reported tray_available=false: $($body.tray_available_error)"
          }
          taskkill /PID $p.Id /T /F
          Write-Host "smoke test ok"

      # WS-529: locale key alignment + no hard-coded Chinese in the host UI.
      # The guard runs from the repo root because it resolves host/locales and
      # scans host/** for user-visible Chinese.
      - name: i18n guard (WS-529)
        run: python tools/check_i18n.py


      - name: Unit tests (close_decision + macro parse + WS-378 OTA diagnostic + WS-420 OTA flash guard + encoder rotation actions + WS-476 pin validation + WS-484 macro summary + WS-495 stop running action + WS-499 12-key layout + WS-508 no-key sentinel + WS-512 device trust + WS-523 online update + WS-529 i18n + WS-542 sleep wake inputs + WS-546 key modifiers + WS-570 update script + WS-619 action backup io)
        working-directory: host
        run: |
          python -m pytest test_close_decision.py test_macro_parse.py test_ota_diag.py test_ota_flash_guard.py test_encoder_actions.py test_pin_validation.py test_macro_summary.py test_action_cancel.py test_layout.py test_keycode_none.py test_key_mods.py test_device_trust.py test_app_update.py test_update_script_windows.py test_fw_update.py test_release_pipeline.py test_i18n.py test_sleep_wake.py test_actions_io.py -v


      # WS-558: rolling release notes list only the increment since the
      # previous main-* tag. Runs from the repo root because the test builds
      # throwaway git repositories there (tools/test_release_notes.py).
      - name: Release notes regression (WS-558)
        run: python -m pytest tools/test_release_notes.py -v

      # Front-end regression tests (plain node scripts under host/).  All of
      # them are listed explicitly: a test file that is not named here never
      # runs, so a "local-only" regression test protects nobody (WS-480).
      #   test_log_follow.mjs        WS-470 log follow / pause
      #   test_portal_ota_progress.mjs WS-519 portal OTA progress
      #   test_stop_button.mjs       WS-498 macro stop button
      #   test_update_progress.mjs   WS-530 firmware update progress
      #   test_app_update_confirm.mjs WS-531 update confirm prompt
      #   test_i18n_params.mjs       WS-541 event params / language switch
      #   test_log_device.mjs        WS-537 log device tag / filter / copy
      #   test_portal_wake.mjs       WS-542 portal/host wake-input wording
      #   test_portal_exit.mjs       WS-551 portal exit / restart route
      #   test_reconnect_sync.mjs    WS-561 reconnect config reconcile
      #   test_reconnect_pending.mjs WS-565 encoder-mode dirty check on reconnect
      #   test_portal_dirty.mjs      WS-572 portal unsaved state / cross-form guard
      #   test_update_popup.mjs      WS-577 update popup info levels / recheck / copy
      #   test_cfg_status.mjs        WS-584 top-bar config status tri-state
      #   test_key_editor.mjs        WS-585 key rows / inspector / press+running
      #   test_device_encoder.mjs    WS-586 device strip / encoder segments / fw method
      #   test_ui_p1_4.mjs           WS-587 log two-level filter / help include / update blocks
      #   test_portal_wifi_secret.mjs WS-590 portal does not echo the WiFi password
      #   test_ui_leftovers.mjs      WS-596 retranslate keeps macro draft / log
      #                              time+kind escaped / untrusted "ignore for now"
      #   test_portal_clock.mjs      WS-602 portal countdown / extend 5 min / timeout banner
      #   test_portal_wifi_state.mjs WS-610 WiFi status auto-update / POST /wifi/retry
      #   test_actions_import_preview.mjs WS-619 import preview counts / no text: body / cancel no request
      - name: Front-end regression tests (node --test)
        working-directory: host
        run: |
          node --test test_log_follow.mjs test_portal_ota_progress.mjs test_portal_exit.mjs test_stop_button.mjs test_update_progress.mjs test_app_update_confirm.mjs test_i18n_params.mjs test_log_device.mjs test_portal_wake.mjs test_reconnect_sync.mjs test_reconnect_pending.mjs test_portal_dirty.mjs test_update_popup.mjs test_cfg_status.mjs test_key_editor.mjs test_device_encoder.mjs test_ui_p1_4.mjs test_portal_wifi_secret.mjs test_ui_leftovers.mjs test_portal_clock.mjs test_portal_wifi_state.mjs test_actions_import_preview.mjs

      # WS-569: exactly one upload per artifact name. A second upload of the
      # same name fails the job with 409 Conflict, which turned every PR into
      # a red windows-exe regardless of its diff. Guarded by
      # tools/test_workflows.py.
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: BindDeckLite-windows
          path: host/dist/BindDeckLite.exe
          if-no-files-found: error