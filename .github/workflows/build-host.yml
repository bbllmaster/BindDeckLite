name: Build Host EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  host:
    name: host / windows-exe
    # A genuine Windows .exe can only be produced on a Windows runner; the
    # host app targets Windows users (macros / media keys via the keyboard lib).
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r host/requirements.txt
          # Macros and media keys are optional in app.py but need the
          # keyboard library on Windows; install it so the frozen image
          # supports them out of the box.
          python -m pip install pyinstaller keyboard

      - name: Build Windows exe
        run: |
          python host/build_exe.py --onefile --name BindDeckLite --dist host/dist
          # Non-silent verification: the one-file exe must exist after the build.
          if (-not (Test-Path host/dist/BindDeckLite.exe)) {
            throw "BindDeckLite.exe was not produced"
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-exe
          path: |
            host/dist/BindDeckLite.exe
          if-no-files-found: error