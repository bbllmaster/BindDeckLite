name: Build Windows host exe

# The single Windows exe packaging path: pyinstaller app.spec (windowed, icon,
# pystray / PIL / tkinter hidden imports, templates + static + assets bundled).
#   * workflow_dispatch  - on-demand build for a tag or a manual snapshot
#   * pull_request       - CI gate: the exe must build and serve before merge
# Push to main and tag pushes are handled by release.yml (which builds the same
# app.spec and publishes the release), so this workflow does not duplicate them.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build exe
        working-directory: host
        run: pyinstaller --noconfirm --clean app.spec

      - name: Smoke test (starts, serves, exits)
        working-directory: host
        shell: pwsh
        run: |
          $env:BINDDECKLITE_PORT = "8799"
          $env:BINDDECKLITE_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\BindDeckLite.exe" -ArgumentList "--desktop","--no-tray","--minimized" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8799/api/desktop -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { throw "exe did not serve /api/desktop" }
          $body = $r.Content | ConvertFrom-Json
          if (-not $body.frozen) { throw "exe did not report frozen=true" }
          # tray_available() must return True in the packaged exe: pystray +
          # Pillow must be importable, otherwise minimize-to-tray silently
          # degrades to exit (WS-374 review #2).  Probed unconditionally
          # (independent of --no-tray) so this check is meaningful.
          if (-not $body.tray_available) {
            throw "exe reported tray_available=false: $($body.tray_available_error)"
          }
          taskkill /PID $p.Id /T /F
          Write-Host "smoke test ok"

      - name: Unit tests (close_decision + macro parse + WS-378 OTA diagnostic)
        working-directory: host
        run: |
          python -m pytest test_close_decision.py test_macro_parse.py test_ota_diag.py -v

      - uses: actions/upload-artifact@v4
        with:
          name: BindDeckLite-windows
          path: host/dist/BindDeckLite.exe
          if-no-files-found: error