; Bootloader-only probe built with ESP-IDF (not Arduino) so we can enable
; CONFIG_SPI_FLASH_ROM_IMPL and match the flash behaviour of Tasmota's build.
[env:idf]
platform = espressif32@7.1.3
board = esp32-c3-devkitc-02
framework = espidf
board_build.partitions = ../partitions/binddecklite_ota_c3.csv
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
