; Bootloader-only project, built with ESP-IDF (not Arduino) so the 16 MB C3
; bootloader can be built with CONFIG_SPI_FLASH_ROM_IMPL=y and a 16 MB flash
; header - the stock Arduino bootloader is built for 4 MB.
;
; Build: pio run -d bl_idf -e idf
;        -> bl_idf/.pio/build/idf/bootloader.bin
[env:idf]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitc-02
framework = espidf
board_build.partitions = ../partitions/binddecklite_16mb_c3.csv
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
